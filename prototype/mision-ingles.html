const STORE_KEY = "mision-ingles-v1";
const pad = n => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (key, n) => { const [y, m, d] = key.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + n); return dkey(dt); };
const TODAY = () => dkey();
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); };

/* Text to speech (no permission needed) */
function speak(text, rate) {
  try {
    const synth = window.speechSynthesis; if (!synth) { toast("Tu navegador no puede leer en voz alta."); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || S.profile.rate || 0.9;
    const v = synth.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || synth.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    synth.speak(u);
  } catch (e) { toast("No se pudo reproducir el audio."); }
}

/* Speech recognition when the browser allows it; otherwise the keyboard's dictation mic. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = !SR;
function startDictation(target, onDone) {
  if (micBlocked) { toast("Usa el micrófono del teclado de tu celular para dictar."); target.focus(); return null; }
  const rec = new SR(); rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  const base = target.value ? target.value.trim() + " " : "";
  rec.onresult = ev => { let txt = ""; for (const r of ev.results) txt += r[0].transcript; target.value = base + txt.trim(); target.dispatchEvent(new Event("input")); };
  rec.onerror = ev => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture") { micBlocked = true; toast("El micrófono no está disponible aquí. Dicta con el teclado o escribe."); renderAll(); } };
  rec.onend = () => onDone && onDone();
  try { rec.start(); } catch (e) { micBlocked = true; return null; }
  return rec;
}

/* ============================== GAME LOGIC ============================== */
function addXP(n, why) {
  const t = TODAY(); const before = S.xpByDay[t] || 0;
  S.xpByDay[t] = before + n; S.totalXP += n; S.gems += Math.floor(n / 5);
  if (before < S.profile.dailyGoal && S.xpByDay[t] >= S.profile.dailyGoal) setTimeout(() => toast("¡Meta diaria cumplida! Tu racha suma un día."), 900);
  checkBadges(); save();
  if (why) toast(`+${n} XP · ${why}`);
}
function streak() {
  let d = TODAY(), n = 0;
  if (!(S.xpByDay[d] > 0)) d = addDays(d, -1);
  while (S.xpByDay[d] > 0) { n++; d = addDays(d, -1); }
  return n;
}
const MISSION_XP = { speak: 20, pron: 15, grammar: 15, review: 10, chat: 20 };
function missionDone(id) { return (S.missions[TODAY()] || []).includes(id); }
function completeMission(id, label) {
  const t = TODAY(); S.missions[t] = S.missions[t] || [];
  if (S.missions[t].includes(id)) { addXP(5, label + " (práctica extra)"); return; }
  S.missions[t].push(id); addXP(MISSION_XP[id], "Misión: " + label);
}
function bumpSkill(k, v) { if (v == null || isNaN(v)) return; v = Math.max(0, Math.min(100, Math.round(v))); S.skills[k] = S.skills[k] == null ? v : Math.round(S.skills[k] * 0.7 + v * 0.3); }
function logSession(type, scores) { S.sessions.push({ d: TODAY(), type, scores }); if (S.sessions.length > 80) S.sessions = S.sessions.slice(-80); }
function addMistake(wrong, right, why, rule, src) {
  if (!wrong || !right || wrong.trim().toLowerCase() === right.trim().toLowerCase()) return;
  const norm = wrong.trim().toLowerCase();
  if (S.mistakes.some(m => m.wrong.trim().toLowerCase() === norm)) return;
  S.mistakes.unshift({ d: TODAY(), wrong: wrong.trim(), right: right.trim(), why: why || "", rule: rule || "Otro", src });
  if (S.mistakes.length > 150) S.mistakes.length = 150;
  S.cards.push({ id: "m" + Date.now() + Math.floor(Math.random() * 1000), front: "Corrige: «" + wrong.trim() + "»", back: right.trim(), ex: why || "", tag: "mi error", due: null, ivl: 0, ease: 2.5, reps: 0, lapses: 0, speakBack: true });
}

/* Daily picks, stable for the day */
function pickOfDay(list, salt) { return list[hash(TODAY() + salt) % list.length]; }
function todaysTopic() { const l = SPEAK_TOPICS[band()]; return l[hash(TODAY() + "speak") % l.length]; }
function todaysSound() { return pickOfDay(SOUNDS, "sound"); }
function todaysScenario() { return pickOfDay(SCENARIOS, "scen"); }
function todaysGrammar() {
  const max = levelIdx(S.profile.level);
  const pool = GRAMMAR.filter(g => levelIdx(g.lv) <= Math.max(max, 1));
  const pending = pool.filter(g => !(S.grammar[g.id] >= 75));
  const list = pending.length ? pending : pool;
  return list[hash(TODAY() + "gram") % list.length];
}

/* SRS (SM-2 simplificado) */
const NEW_PER_DAY = 8;
function dueCards() {
  const t = TODAY();
  const due = S.cards.filter(c => c.reps > 0 && c.due && c.due <= t);
  const newLeft = Math.max(0, NEW_PER_DAY - (S.newByDay[t] || 0));
  const mine = S.cards.filter(c => c.reps === 0 && c.tag === "mi error");
  const fresh = S.cards.filter(c => c.reps === 0 && c.tag !== "mi error");
  return due.concat(mine.concat(fresh).slice(0, newLeft));
}
function schedule(c, g) { // g: 0 otra vez, 1 difícil, 2 bien, 3 fácil
  const n = { ...c };
  if (g === 0) { n.lapses++; n.ivl = 0; n.ease = Math.max(1.3, n.ease - 0.2); n.reps = Math.max(1, n.reps); n.due = TODAY(); return n; }
  if (g === 1) { n.ivl = Math.max(1, Math.round((n.ivl || 1) * 1.2)); n.ease = Math.max(1.3, n.ease - 0.15); }
  if (g === 2) { n.ivl = n.reps === 0 ? 1 : n.ivl <= 1 ? 3 : Math.round(n.ivl * n.ease); }
  if (g === 3) { n.ivl = n.reps === 0 ? 4 : Math.round(Math.max(n.ivl, 2) * n.ease * 1.3); n.ease += 0.15; }
  n.reps++; n.due = addDays(TODAY(), n.ivl); return n;
}
const ivlLabel = (c, g) => { const n = schedule(c, g); return g === 0 ? "hoy" : n.ivl === 1 ? "1 día" : n.ivl + " días"; };
const learnedCount = () => S.cards.filter(c => c.ivl >= 3).length;

/* Local (no-AI) speaking analysis */
function localAnalyze(text, secs) {
  const w = words(text); const n = w.length;
  const fixes = [];
  for (const r of RULES) { const m = text.match(r.re); if (m) { const right = r.fix(m); if (right) fixes.push({ original: m[0], corrected: right, explanation_es: r.why, rule: r.rule }); } }
  const fillers = (text.toLowerCase().match(/\b(um+|uh+|eh+|ehm|este|you know|i mean)\b|,\s*like\s*,/g) || []).length;
  const uniq = new Set(w).size; const ttr = n ? uniq / n : 0;
  const longW = w.filter(x => x.length >= 7).length / (n || 1);
  const wpm = secs > 5 ? Math.round(n / (secs / 60)) : null;
  const flu = wpm == null ? Math.min(100, 40 + n * 0.6) : Math.max(20, 100 - Math.abs(130 - wpm) * 0.7) - fillers * 3;
  const vocab = Math.min(100, Math.round(ttr * 70 + longW * 120 + 10));
  const gram = Math.max(30, Math.round(100 - fixes.length * (60 / Math.max(1, n / 25))));
  const coh = Math.min(100, Math.round(35 + Math.min(n, 120) * 0.45 + ((text.match(/\b(because|so|however|first|then|finally|although|but|also)\b/gi) || []).length) * 4));
  return { n, wpm, fillers, fixes, scores: { fluency: Math.round(Math.max(0, flu)), grammar: gram, vocabulary: vocab, coherence: coh } };
}

function chart14() {

  const goal = S.profile.dailyGoal;

  const W = 560, H = 170, L = 30, B = 24, T = 10, bw = (W - L) / 14;
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, Math.round(max / 2), Math.round(max)];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP por día, últimos 14 días">`;
  for (const tv of ticks) s += `<line x1="${L}" x2="${W}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(tv) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${tv}</text>`;
  vals.forEach((v, i) => {
    const x = L + i * bw + 4, w = bw - 8, top = y(v), base = y(0);
    const isToday = i === 13;
    if (v > 0) {
      const hgt = base - top, r = Math.min(4, hgt);
      s += `<path d="M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${base} Z" fill="${v >= goal ? "var(--accent)" : "var(--flame-fill)"}" opacity="${isToday ? 1 : .88}"/>`;
    }

    s += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
  });
  s += `<line x1="${L}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W}" y="${y(goal) - 5}" text-anchor="end" font-size="11" fill="var(--ink)">meta ${goal} XP</text>`;
  s += "</svg>";
  return { svg: s, days, vals };
}

async function evaluateSpeak(text, tp) {
  const n = words(text).length;

  if (!aiOn()) { finishSpeak(); return; }
  speakBusy = true; speakCtl = new AbortController(); renderSpeak();
  const prompt = `You are an expert English speaking coach for native Spanish speakers (like Stimuler or ELSA). The learner (CEFR level ${S.profile.level}, goal: ${GOALS[S.profile.goal]}) answered the speaking prompt "${tp.t}". The text below is a speech-to-text transcript, so IGNORE punctuation, capitalization and small transcription artifacts.

"""${text.slice(0, 4000)}"""

Evaluate it. Reply with ONLY a JSON object with this exact shape:
{"scores":{"fluency":0-100,"grammar":0-100,"vocabulary":0-100,"coherence":0-100},"cefr_estimate":"A1|A2|B1|B2|C1|C2","corrections":[{"original":"exact words from transcript","corrected":"corrected version","explanation_es":"explicación breve en español de la regla","rule":"nombre corto de la regla en español"}],"better_version":"a natural, improved version of the whole answer at one level above the learner's level, max 90 words","vocabulary_upgrades":[{"basic":"word they used","advanced":"better word/phrase","example":"short example sentence"}],"tip_es":"un consejo concreto en español para su próxima respuesta"}

  try {

}

/* Pronunciation (shadowing): compare what the recognizer heard with the target sentence. */
function alignWords(target, said) {
  const t = words(target), s = words(said);
  const dp = Array.from({ length: t.length + 1 }, () => Array(s.length + 1).fill(0));
  for (let i = t.length - 1; i >= 0; i--) for (let j = s.length - 1; j >= 0; j--) dp[i][j] = t[i] === s[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Set(); let i = 0, j = 0;
  while (i < t.length && j < s.length) { if (t[i] === s[j]) { ok.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  const tokens = target.split(/\s+/);
  let wi = 0;
  const html = tokens.map(tok => { const has = /[a-z]/i.test(tok); const cls = has ? (ok.has(wi) ? "w-ok" : "w-miss") : ""; if (has) wi++; return `<span class="${cls}">${esc(tok)}</span>`; }).join(" ");
  return { score: t.length ? Math.round(ok.size / t.length * 100) : 0, html };
}

function checkPron(snd, i) {

function chatRules() {
  const sc = scenario();
  return `ROLEPLAY INSTRUCTIONS. You are ${sc.role}. You are talking with an English learner whose native language is Spanish, CEFR level ${S.profile.level}. Stay in character. Keep each reply to 1-3 short, natural sentences adapted to the learner's level, and usually end with a question to keep the conversation going.
For the learner's LAST message, check for real errors (grammar, wrong word, unnatural phrasing). Ignore capitalization, punctuation and small speech-to-text artifacts.
Reply with ONLY a JSON object: {"reply":"your in-character reply","correction":null} when the message is fine, or {"reply":"...","correction":{"corrected":"the learner's message, corrected and natural","explanation_es":"explicación breve en español","rule":"nombre corto de la regla en español"}} when it has an error.`;
}

  const turns = [{ role: "user", content: chatRules() }, ...chatTurns.slice(-14).map(t => ({ role: t.role, content: t.content }))];
  const me = chatTurns[chatTurns.length - 1];
  try {
    const r = await sample.json(turns, { modelTier: "quick", cache: false, signal: chatCtl.signal });
    if (r && r.correction && r.correction.corrected) { me.corr = r.correction; addMistake(text, r.correction.corrected, r.correction.explanation_es, r.correction.rule, "conversación"); }
    else me.corr = "ok";
    chatTurns.push({ role: "assistant", content: String((r && r.reply) || "Sorry, could you say that again?") });
    chatUserTurns++;
    if (chatUserTurns === 4) { logSession("chat", { scen: scenario().id }); completeMission("chat", "Conversación"); renderHeader(); }
    else save();
  } catch (e) { const m = aiError(e); if (m) toast(m); chatTurns.pop(); inp.value = text; }
  chatBusy = false; renderConversar();
  if (chatTurns[chatTurns.length - 1].role === "assistant" && !$("#chatIn").value) $("#chatIn").focus();
}
async function chatHelp() {
  if (!aiOn()) return;
  const last = chatTurns.filter(t => t.role === "assistant").pop();
  try {
    const r = await sample.json(`An English learner (CEFR ${S.profile.level}, native Spanish speaker) is in a roleplay: ${scenario().role}. The other person just said: "${last.content}". Suggest 3 different natural replies the learner could say, at their level, each under 18 words. Reply with ONLY a JSON array of 3 strings.`, { modelTier: "quick" });
    if (Array.isArray(r)) { chatSugs = r.slice(0, 3).map(String); renderConversar(); }
  } catch (e) { const m = aiError(e); if (m) toast(m); }
}

/* ============================== RENDER: GRAMÁTICA ============================== */
let gramTopic = null, gramAnswers = {}, gramAI = {}, askBusy = false, askCtl = null, askOut = "";
function renderGramatica() {
  const el = $("#view-gramatica");
  const g = GRAMMAR.find(x => x.id === gramTopic) || todaysGrammar(); gramTopic = g.id;
  const ans = gramAnswers[g.id] || {};
  const answered = Object.keys(ans).length, right = Object.values(ans).filter(v => v.ok).length;
  el.innerHTML = `<div class="grid2">
    <div class="stack">
      <div class="card" style="display:grid;gap:14px">
        <div class="card-head" style="margin:0"><div><span class="eyebrow">Nivel ${g.lv}${g.id === todaysGrammar().id ? " · misión de hoy" : ""}</span><h2>${esc(g.name)}</h2></div>${S.grammar[g.id] != null ? `<span class="pill ${S.grammar[g.id] >= 75 ? "ok" : ""}">Mejor: ${S.grammar[g.id]}%</span>` : ""}</div>
        <p>${esc(g.exp)}</p>
        <div class="formula">${esc(g.formula)}</div>
        <ul class="examples">${g.ex.map(x => `<li><button class="btn ghost sm" type="button" data-say="${esc(x)}" aria-label="Escuchar">${ICON.play}</button><span>${esc(x)}</span></li>`).join("")}</ul>
      </div>
      <div class="card"><div class="card-head"><h2>Practica</h2><span class="pill neutral">${right} / ${g.qs.length} correctas</span></div>
        <div class="qs">${g.qs.map((q, i) => { const a = ans[i]; return `<div class="q">
          <div class="stem">${i + 1}. ${esc(q.s)}</div>
          <div class="opts">${q.o.map((o, j) => `<button class="opt ${a ? (j === q.a ? "right" : j === a.pick ? "wrong" : "") : ""}" type="button" data-q="${i}" data-o="${j}" ${a ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
          ${a ? `<div class="expl">${a.ok ? "<b>¡Correcto!</b> " : "<b>No exactamente.</b> "}${esc(q.why)}
            ${gramAI[g.id + i] ? `<p class="ai-out" style="margin-top:8px">${esc(gramAI[g.id + i])}</p>` : aiOn() ? `<div style="margin-top:8px"><button class="btn ghost sm" type="button" data-explain="${i}">Explica mi respuesta</button></div>` : ""}</div>` : ""}
        </div>`; }).join("")}</div>
        ${answered === g.qs.length ? `<div class="row" style="margin-top:14px"><button class="btn ghost" type="button" id="gRetry">Repetir ejercicios</button></div>` : ""}
      </div>
    </div>
    <div class="stack">
      <div class="card" style="display:grid;gap:10px"><h2>Pregúntale al profe</h2>
        <p class="small muted">Cualquier duda de gramática, en español. Ej.: «¿Cuándo uso <i>make</i> y cuándo <i>do</i>?»</p>
        <textarea id="askIn" style="min-height:80px" placeholder="Escribe tu pregunta…" ${aiOn() ? "" : "disabled"}></textarea>
        <div class="row"><button class="btn" type="button" id="askBtn" ${aiOn() && !askBusy ? "" : "disabled"}>${askBusy ? "Pensando…" : "Preguntar"}</button>${askBusy ? `<button class="btn ghost" type="button" id="askStop">Detener</button>` : ""}</div>
        ${!aiOn() && aiState !== "connecting" ? `<p class="hint">Disponible con el coach IA activado.</p>` : ""}
        <div class="ai-out" id="askOut">${esc(askOut)}</div>
      </div>
      <div class="card"><div class="card-head"><h2>Temas</h2><span class="small muted">${GRAMMAR.filter(x => S.grammar[x.id] >= 75).length} / ${GRAMMAR.length} dominados</span></div>
        <div class="topics">${GRAMMAR.map(x => `<button class="topic" type="button" data-topic="${x.id}" aria-current="${x.id === g.id}"><span class="lv">${x.lv}</span><span>${esc(x.name)}</span>${S.grammar[x.id] != null ? `<span class="pill ${S.grammar[x.id] >= 75 ? "ok" : ""}">${S.grammar[x.id]}%</span>` : `<span></span>`}</button>`).join("")}</div>
      </div>
    </div>
  </div>`;
  $$("[data-say]", el).forEach(b => b.onclick = () => speak(b.dataset.say));
  $$("[data-topic]", el).forEach(b => b.onclick = () => { gramTopic = b.dataset.topic; renderGramatica(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $$("[data-o]", el).forEach(b => b.onclick = () => answerQ(g, +b.dataset.q, +b.dataset.o));
  $$("[data-explain]", el).forEach(b => b.onclick = () => explainQ(g, +b.dataset.explain, b));
  if ($("#gRetry")) $("#gRetry").onclick = () => { gramAnswers[g.id] = {}; renderGramatica(); };
  $("#askBtn").onclick = askTeacher;
  if ($("#askStop")) $("#askStop").onclick = () => askCtl && askCtl.abort();
}
function answerQ(g, i, j) {
  const ans = gramAnswers[g.id] = gramAnswers[g.id] || {};
  if (ans[i]) return;
  const q = g.qs[i]; ans[i] = { pick: j, ok: j === q.a };
  if (!ans[i].ok) addMistake(q.s.replace("___", q.o[j]), q.s.replace("___", q.o[q.a]), q.why, g.name, "gramática");
  if (Object.keys(ans).length === g.qs.length) {
    const pct = Math.round(Object.values(ans).filter(v => v.ok).length / g.qs.length * 100);
    S.grammar[g.id] = Math.max(S.grammar[g.id] || 0, pct); bumpSkill("gram", pct); logSession("grammar", { topic: g.id, pct });
    if (pct >= 75) completeMission("grammar", g.name); else { save(); toast(`${pct}%: repite para llegar a 75% y completar la misión.`); }
    renderHeader();
  }
  renderGramatica();
}
async function explainQ(g, i, btn) {
  const q = g.qs[i], a = gramAnswers[g.id][i];
  btn.disabled = true; btn.textContent = "Pensando…";
  const prompt = `Eres un profesor de inglés para hispanohablantes. Ejercicio: "${q.s}" Opciones: ${q.o.map(o => `"${o}"`).join(", ")}. Correcta: "${q.o[q.a]}". El alumno (nivel ${S.profile.level}) eligió "${q.o[a.pick]}"${a.ok ? " (correcto)" : " (incorrecto)"}. Explica en español, en máximo 90 palabras y sin markdown, por qué la respuesta correcta es esa${a.ok ? "" : " y por qué su opción no funciona"}, con un ejemplo extra en inglés.`;
  try {
    const { text } = await sample(prompt, { modelTier: "quick", onText: ({ text }) => { gramAI[g.id + i] = text; const box = btn.parentElement; if (box) box.innerHTML = `<p class="ai-out">${esc(text)}</p>`; } });
    gramAI[g.id + i] = text;
  } catch (e) { const m = aiError(e); if (m) toast(m); }
  renderGramatica();
}
async function askTeacher() {
  const q = $("#askIn").value.trim(); if (!q || !aiOn()) return;
  askBusy = true; askCtl = new AbortController(); askOut = ""; renderGramatica(); $("#askOut").textContent = "Pensando…";
  try {
    const { text } = await sample(`Eres un profesor de inglés paciente y claro para hispanohablantes de nivel ${S.profile.level}. Responde en español, en menos de 180 palabras, sin markdown (usa guiones simples si haces listas), con 2 o 3 ejemplos en inglés con su traducción. Pregunta del alumno: ${q.slice(0, 1500)}`,
      { signal: askCtl.signal, onText: ({ text }) => { askOut = text; const o = $("#askOut"); if (o) o.textContent = text; } });
    askOut = text; addXP(3, "Pregunta de gramática");
  } catch (e) { askOut = e.text || ""; const m = aiError(e); if (m) toast(m); }
  askBusy = false; renderGramatica();
}

/* ============================== RENDER: REPASO ============================== */
let rvQueue = null, rvShow = false, rvDoneSession = 0;
function renderRepaso() {
  const el = $("#view-repaso");
  if (!rvQueue) rvQueue = dueCards().map(c => c.id);
  const card = S.cards.find(c => c.id === rvQueue[0]);
  const t = TODAY(); const reviewed = S.reviewsByDay[t] || 0;
  const stats = { due: S.cards.filter(c => c.reps > 0 && c.due && c.due <= t).length, fresh: S.cards.filter(c => c.reps === 0).length, learned: learnedCount() };
  el.innerHTML = `<div class="grid2">
    <div class="stack">
      <div class="card" style="display:grid;gap:14px">
        <div class="card-head" style="margin:0"><h2>Repaso espaciado</h2><span class="pill neutral">${rvQueue.length} en cola · ${reviewed} hoy</span></div>
        ${card ? `<div class="flash">
            <span class="tag">${esc(card.tag)}</span>
            <div class="front">${esc(card.front)}</div>
            ${rvShow ? `<div class="back"><b>${esc(card.back)}</b></div>${card.ex ? `<div class="ex">${esc(card.ex)}</div>` : ""}` : `<div class="ex">¿Qué significa? Respóndelo en voz alta antes de voltear.</div>`}
          </div>
          <div class="row" style="justify-content:center"><button class="btn ghost sm" type="button" id="rvSay">${ICON.play} Escuchar</button></div>
          ${rvShow ? `<div class="grades">${["Otra vez", "Difícil", "Bien", "Fácil"].map((n, g) => `<button type="button" data-g="${g}">${n}<span>${ivlLabel(card, g)}</span></button>`).join("")}</div>`
            : `<button class="btn" type="button" id="rvFlip">Mostrar respuesta</button>`}`
          : `<div class="flash"><div class="front">¡Al día!</div><div class="ex">No hay más tarjetas para hoy. Vuelve mañana: el repaso espaciado funciona mejor en dosis cortas y diarias.</div></div>`}
      </div>
      <div class="card"><div class="card-head"><h2>Tu mazo</h2></div>
        <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile"><b>${stats.due}</b><span>para repasar</span></div><div class="tile"><b>${stats.fresh}</b><span>nuevas</span></div><div class="tile"><b>${stats.learned}</b><span>aprendidas</span></div></div>
        <p class="small muted" style="margin-top:10px">Máximo ${NEW_PER_DAY} tarjetas nuevas por día. Cada respuesta ajusta cuándo vuelve a aparecer la tarjeta: justo antes de que la olvides.</p>
      </div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-head"><h2>Cuaderno de errores</h2><span class="small muted">${S.mistakes.length} guardados</span></div>
        ${S.mistakes.length ? `<div class="mistakes">${S.mistakes.slice(0, 25).map(m => `<div class="mk"><span><span class="was" style="text-decoration:line-through;color:var(--bad)">${esc(m.wrong)}</span> → <b style="color:var(--good)">${esc(m.right)}</b></span><span class="small muted">${esc(m.why)}</span><span><span class="pill neutral">${esc(m.rule)}</span> <span class="small muted">${esc(m.src || "")} · ${esc(m.d)}</span></span></div>`).join("")}</div>`
          : `<p class="empty">Aún no hay errores guardados. Cuando el coach te corrija al hablar, conversar o en gramática, cada error aparecerá aquí y se convertirá en una tarjeta.</p>`}
      </div>
    </div>
  </div>`;
  if (card) {
    $("#rvSay").onclick = () => speak(rvShow && (card.tag === "mi error") ? card.back : card.tag === "mi error" ? card.back : card.front);
    if ($("#rvFlip")) $("#rvFlip").onclick = () => { rvShow = true; renderRepaso(); if (card.tag !== "mi error") speak(card.ex || card.front); };
    $$("[data-g]", el).forEach(b => b.onclick = () => gradeCard(card, +b.dataset.g));
  }
}
function gradeCard(card, g) {
  const t = TODAY();
  if (card.reps === 0) S.newByDay[t] = (S.newByDay[t] || 0) + 1;
  const n = schedule(card, g); Object.assign(card, n);
  S.reviewsByDay[t] = (S.reviewsByDay[t] || 0) + 1; rvDoneSession++;
  rvQueue.shift(); if (g === 0) rvQueue.push(card.id);
  rvShow = false;
  const target = Math.min(10, rvDoneSession + rvQueue.length);
  if (!missionDone("review") && (S.reviewsByDay[t] >= 10 || rvQueue.length === 0) && S.reviewsByDay[t] >= Math.min(10, target)) { completeMission("review", "Repaso"); renderHeader(); }
  else save();
  renderRepaso();
}

/* ============================== SETTINGS ============================== */
let confirmReset = false;
function openSettings() {
  const p = S.profile;
  $("#overlayHost").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h2 id="stTitle">Ajustes</h2>
    <div class="field"><label for="stName">Tu nombre</label><input type="text" id="stName" value="${esc(p.name)}" placeholder="Opcional"></div>
    <div class="field"><label for="stLevel">Nivel actual</label><select id="stLevel">${LEVELS.slice(0, 5).map(l => `<option ${l === p.level ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="stGoal">Objetivo</label><select id="stGoal">${Object.entries(GOALS).map(([k, v]) => `<option value="${k}" ${k === p.goal ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    <div class="field"><label for="stDaily">Meta diaria</label><select id="stDaily">${[[30, "30 XP · 10 min (relajado)"], [50, "50 XP · 15 min (regular)"], [80, "80 XP · 25 min (serio)"], [120, "120 XP · 40 min (intenso)"]].map(([v, n]) => `<option value="${v}" ${v === p.dailyGoal ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="field"><label for="stRate">Velocidad de la voz</label><select id="stRate">${[[0.75, "Lenta"], [0.9, "Normal"], [1, "Nativa"]].map(([v, n]) => `<option value="${v}" ${v === p.rate ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <p class="small muted">Tu progreso se guarda en ${syncLabel}.</p>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost sm" type="button" id="stReset" style="color:var(--bad)">${confirmReset ? "Pulsa otra vez para borrar todo" : "Borrar progreso"}</button>
      <div class="row"><button class="btn ghost" type="button" id="stCancel">Cancelar</button><button class="btn" type="button" id="stSave">Guardar</button></div>
    </div></div></div>`;
  $("#stCancel").onclick = closeSettings;
  $("#ov").onclick = e => { if (e.target.id === "ov") closeSettings(); };
  $("#stSave").onclick = () => {
    Object.assign(S.profile, { name: $("#stName").value.trim().slice(0, 40), level: $("#stLevel").value, goal: $("#stGoal").value, dailyGoal: +$("#stDaily").value, rate: +$("#stRate").value });
    save(); closeSettings(); renderAll(); toast("Ajustes guardados");
  };
  $("#stReset").onclick = () => {
    if (!confirmReset) { confirmReset = true; openSettings(); return; }
    const prof = S.profile; S = defaultState(); S.profile = prof; rvQueue = null; save(); closeSettings(); renderAll(); toast("Progreso borrado");
  };
  $("#stName").focus();
}
function closeSettings() { confirmReset = false; $("#overlayHost").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov")) closeSettings(); });

/* ============================== ROUTER ============================== */
let tab = "hoy";
try { tab = sessionStorage.getItem("mi-tab") || "hoy"; } catch (e) { }
if (/^#(hoy|hablar|conversar|gramatica|repaso)$/.test(location.hash)) tab = location.hash.slice(1);
const RENDER = { hoy: renderHoy, hablar: renderHablar, conversar: renderConversar, gramatica: renderGramatica, repaso: renderRepaso };
function go(t) {
  tab = t; try { sessionStorage.setItem("mi-tab", t); } catch (e) { }
  $$(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  $$(".view").forEach(v => { v.hidden = v.id !== "view-" + t; });
  RENDER[t](); renderHeader();
}
function renderAll() { go(tab); }
$$(".tab").forEach(b => b.onclick = () => { if (b.dataset.tab === "repaso") rvQueue = null; go(b.dataset.tab); window.scrollTo({ top: 0 }); });
$("#btnSettings").onclick = openSettings;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  if (b.dataset.sub) hablarMode = b.dataset.sub;
  if (b.dataset.topic) gramTopic = b.dataset.topic;
  if (b.dataset.scen && b.dataset.scen !== chatScen) resetChat(b.dataset.scen);
  if (b.dataset.go === "repaso") rvQueue = null;
  go(b.dataset.go); window.scrollTo({ top: 0 });
});
try { speechSynthesis && speechSynthesis.getVoices(); } catch (e) { }
renderAll();

/* ============================== CAPABILITIES ============================== */
(async () => {
  if (!window.claude || !window.claude.use) { aiState = "off"; renderAll(); return; }
  try {
    const [s, u, d] = await Promise.all([claude.use("sample"), claude.use("user"), claude.use("db")]);
    sample = s; aiState = s ? "on" : "off";
    if (u && d) {
      const id = await u.id();
      if (id) {
        const ref = d.doc("data/users/" + id + "/progreso");
        try {
          const snap = await ref.get();
          const remote = snap.exists ? snap.data() : null;
          if (remote && typeof remote.state === "string" && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
            S = Object.assign(defaultState(), JSON.parse(remote.state)); rvQueue = null;
            try { localStorage.setItem(STORE_KEY, remote.state); } catch (e) { }
          }
          docRef = ref; syncLabel = "tu cuenta";
          if (!remote && S.updatedAt) save();
        } catch (e) { docRef = null; }
      }
    }
  } catch (e) { aiState = sample ? "on" : "off"; }
  renderAll();
})();
</script>
